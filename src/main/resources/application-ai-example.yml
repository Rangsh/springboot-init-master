# LLM 配置（示例文件，请勿提交真实密钥）
# 使用方式：
#   1. 复制关键配置到 application-dev.yml
#   2. 或通过环境变量注入 API Key
#   3. 生产环境使用 application-prod.yml + 环境变量

llm:
  # 全局开关：设为 true 启用 AI 模块
  enabled: false
  # 默认 Provider
  default-provider: openai

  providers:
    # ---- OpenAI ----
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      default-model: gpt-4o
      models:
        - gpt-4o
        - gpt-4o-mini
        - gpt-4-turbo
      request-timeout: 60s
      connect-timeout: 10s
      max-retries: 1
      stream-include-usage: true   # 仅 OpenAI 原生 API 支持

    # ---- Claude / Anthropic ----
    claude:
      enabled: false
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      default-model: claude-sonnet-5-20251001
      models:
        - claude-sonnet-5-20251001
        - claude-haiku-4-5-20251001
      request-timeout: 60s
      connect-timeout: 10s
      max-retries: 1

    # ---- DeepSeek ----
    deepseek:
      enabled: false
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      default-model: deepseek-chat
      models:
        - deepseek-chat
        - deepseek-reasoner
      request-timeout: 60s
      connect-timeout: 10s
      max-retries: 1

    # ---- 本地 Ollama ----
    local:
      enabled: false
      base-url: http://localhost:11434
      default-model: llama3.1
      models:
        - llama3.1
        - qwen2.5
        - deepseek-r1:8b
      request-timeout: 120s
      connect-timeout: 10s
      max-retries: 0

  http-client:
    max-idle-connections: 5
    keep-alive-duration: 5m
