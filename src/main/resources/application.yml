# 公共配置（默认面向本地开发，请按本机环境修改）
server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api

spring:
  application:
    name: springboot-init-master
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # 本地 MySQL + Druid
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/springboot_init?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 5000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true
        slf4j:
          enabled: true
      # 本地监控页：http://localhost:8101/api/druid/index.html（账号见下）
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        reset-enable: false
  # 本地 Redis（默认无密码；需要时再加 password）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志在 application-dev.yml 打开
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token（Header: Authorization: Bearer <token>）
sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  token-prefix: Bearer
  is-print: true

# Knife4j 文档页（/doc.html）+ springdoc 生成 OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.ttk.springbootinit.controller
  paths-to-match: /**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# 腾讯云 COS（本地默认关闭，需要时改为 true 并填写密钥）
cos:
  enabled: false
  client:
    access-key:
    secret-key:
    region: ap-guangzhou
    bucket:
